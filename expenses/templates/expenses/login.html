{% extends 'expenses/base.html' %}

{% block title %}
Login - Expense Tracker
{% endblock %}

{% block content %}

<div class="card" style="max-width: 500px; margin: auto;">

    <h1>Login</h1>

    <br>

    {% if form.errors %}
        <p class="error">
            Invalid username or password.
        </p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Login
        </button>

    </form>

    <br>

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">
            Register here
        </a>
    </p>

</div>

{% endblock %}
