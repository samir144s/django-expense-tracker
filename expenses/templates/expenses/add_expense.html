<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Expense | Expense Tracker</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(
                    135deg,
                    #f4f7fb 0%,
                    #eef2ff 100%
                );
            color: #1f2937;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 45px 20px;
        }

        /* ==============================
           HEADER
        ============================== */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .page-icon {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #4f46e5;
            color: white;

            border-radius: 14px;

            font-size: 25px;

            box-shadow:
                0 8px 20px rgba(79, 70, 229, 0.25);
        }

        .header h1 {
            font-size: 28px;
            color: #111827;
            margin-bottom: 6px;
        }

        .header p {
            color: #6b7280;
            font-size: 14px;
        }

        .back-link {
            text-decoration: none;
            color: #4f46e5;
            background: white;

            padding: 11px 16px;

            border-radius: 9px;

            font-size: 14px;
            font-weight: 600;

            border: 1px solid #e5e7eb;

            transition: 0.2s ease;
        }

        .back-link:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
            transform: translateY(-1px);
        }

        /* ==============================
           CARD
        ============================== */

        .card {
            background: white;

            padding: 34px;

            border-radius: 18px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.07);

            animation: fadeIn 0.35s ease;
        }

        .card-header {
            padding-bottom: 22px;
            margin-bottom: 25px;

            border-bottom: 1px solid #eef0f4;
        }

        .card-header h2 {
            font-size: 19px;
            color: #111827;
            margin-bottom: 6px;
        }

        .card-header p {
            font-size: 13px;
            color: #6b7280;
        }

        /* ==============================
           DJANGO FORM
        ============================== */

        form p {
            margin-bottom: 22px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;

            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            background: #ffffff;

            color: #1f2937;

            font-size: 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        input:hover,
        select:hover,
        textarea:hover {
            border-color: #a5b4fc;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;

            border-color: #4f46e5;

            background: #ffffff;

            box-shadow:
                0 0 0 4px rgba(79, 70, 229, 0.10);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.5;
        }

        select {
            cursor: pointer;
        }

        /* ==============================
           HELP TEXT
        ============================== */

        .helptext {
            display: block;

            margin-top: 7px;

            color: #9ca3af;

            font-size: 12px;
        }

        /* ==============================
           ERRORS
        ============================== */

        .errorlist {
            margin: 0 0 8px 0;

            padding: 9px 12px;

            list-style-position: inside;

            color: #b91c1c;

            background: #fef2f2;

            border: 1px solid #fecaca;

            border-radius: 8px;

            font-size: 13px;
        }

        /* ==============================
           BUTTONS
        ============================== */

        .buttons {
            display: flex;

            align-items: center;

            gap: 12px;

            margin-top: 30px;

            padding-top: 24px;

            border-top: 1px solid #eef0f4;
        }

        .btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 12px 20px;

            min-height: 44px;

            border-radius: 9px;

            border: none;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            text-decoration: none;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .save-btn {
            background: #4f46e5;
            color: white;

            box-shadow:
                0 5px 12px rgba(79, 70, 229, 0.20);
        }

        .save-btn:hover {
            background: #4338ca;

            transform: translateY(-1px);

            box-shadow:
                0 7px 16px rgba(79, 70, 229, 0.25);
        }

        .cancel-btn {
            background: #f3f4f6;
            color: #374151;

            border: 1px solid #e5e7eb;
        }

        .cancel-btn:hover {
            background: #e5e7eb;

            transform: translateY(-1px);
        }

        /* ==============================
           FOOTER NOTE
        ============================== */

        .security-note {
            margin-top: 18px;

            text-align: center;

            color: #9ca3af;

            font-size: 12px;
        }

        /* ==============================
           ANIMATION
        ============================== */

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 650px) {

            .container {
                padding: 25px 15px;
            }

            .header {
                align-items: flex-start;
            }

            .header-left {
                align-items: flex-start;
            }

            .page-icon {
                width: 46px;
                height: 46px;
                font-size: 21px;
            }

            .header h1 {
                font-size: 23px;
            }

            .back-link {
                display: none;
            }

            .card {
                padding: 23px 18px;
                border-radius: 14px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==============================
         PAGE HEADER
    ============================== -->

    <div class="header">

        <div class="header-left">

            <div class="page-icon">
                +
            </div>

            <div>

                <h1>
                    Add Expense
                </h1>

                <p>
                    Record and track a new expense.
                </p>

            </div>

        </div>


        <a
            href="{% url 'dashboard' %}"
            class="back-link"
        >
            ← Dashboard
        </a>

    </div>


    <!-- ==============================
         FORM CARD
    ============================== -->

    <div class="card">


        <div class="card-header">

            <h2>
                Expense Information
            </h2>

            <p>
                Enter the details of your expense below.
            </p>

        </div>


        <form method="post">

            {% csrf_token %}


            {{ form.as_p }}


            <!-- ==============================
                 BUTTONS
            ============================== -->

            <div class="buttons">

                <button
                    type="submit"
                    class="btn save-btn"
                >
                    ✓ Save Expense
                </button>


                <a
                    href="{% url 'dashboard' %}"
                    class="btn cancel-btn"
                >
                    Cancel
                </a>

            </div>


        </form>


    </div>


    <div class="security-note">
        Your expense information is securely saved to your account.
    </div>


</div>


</body>

</html>
