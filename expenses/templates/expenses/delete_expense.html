<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Expense | Expense Tracker</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;

            background: #f4f7fb;

            color: #1f2937;
        }

        .container {
            max-width: 550px;

            margin: 100px auto;

            padding: 20px;
        }

        .card {
            background: white;

            padding: 35px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .icon {
            font-size: 50px;

            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #6b7280;

            margin-bottom: 25px;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 12px;
        }

        button,
        a {
            padding: 12px 20px;

            border-radius: 8px;

            border: none;

            font-size: 15px;

            text-decoration: none;

            cursor: pointer;
        }

        .delete-btn {
            background: #dc2626;

            color: white;
        }

        .cancel-btn {
            background: #e5e7eb;

            color: #374151;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="card">


        <div class="icon">

            ⚠️

        </div>


        <h1>

            Delete Expense?

        </h1>


        <p>

            Are you sure you want to delete
            <strong>{{ expense.title }}</strong>?

            <br>

            This action cannot be undone.

        </p>


        <div class="buttons">


            <form method="post">

                {% csrf_token %}

                <button
                    type="submit"
                    class="delete-btn"
                >

                    Delete Expense

                </button>

            </form>


            <a
                href="{% url 'dashboard' %}"
                class="cancel-btn"
            >

                Cancel

            </a>


        </div>


    </div>


</div>


</body>

</html>
